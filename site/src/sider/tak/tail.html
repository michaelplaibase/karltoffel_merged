

	</div>

	<script>
	(function () {
		// Ét ord (fornavnet) i klartekst i URL'en er ufarligt (ingen accept/decline-logik
		// afhænger af det — det er kun til visning), men vi undgår alligevel at lægge
		// noget følsomt i query-strengen: kun c (svar) og evt. navn sendes af CRM'et.
		var params = new URLSearchParams(location.search);
		var c = params.get("c");
		var navn = (params.get("navn") || "").trim();
		var hilsen = navn ? navn + "!" : "heldige karltoffel!";

		var COPY = {
			accept: {
				titel: "Slå benene op, " + hilsen,
				tekst: "Vi klarer resten. Vi har lagt dig i kalenderen og ringer snarest — typisk inden for et kvarter i åbningstiden — for at bekræfte tid og de sidste detaljer. Du kan roligt læne dig tilbage, mens naboen bliver grøn af misundelse."
			},
			maybe: {
				titel: "Noteret, " + hilsen,
				tekst: "Du har stadig et par spørgsmål, og det er helt fair. Vi ringer og reder trådene ud, så du ved præcis hvad du siger ja eller nej til."
			},
			decline: {
				titel: "Tak for din tid, " + hilsen,
				tekst: "Vi hopper videre uden hårde følelser. Skifter du mening, står tilbuddet stadig — ring eller skriv til os, når det passer dig."
			},
			already_used: {
				titel: "Du har allerede svaret",
				tekst: "Vi har allerede registreret dit svar på det her tilbud. Skal det ændres, er det hurtigst at ringe til os."
			},
			expired: {
				titel: "Linket er udløbet",
				tekst: "Tilbuddet er desværre ikke længere aktivt. Er du stadig interesseret, ringer du bare — så laver vi et nyt."
			},
			error: {
				titel: "Hovsa, noget gik galt",
				tekst: "Vi kunne ikke finde tilbuddet på linket. Ring til os, så finder vi ud af det sammen."
			}
		};

		var valgt = COPY[c] || {
			titel: "Tak for dit svar!",
			tekst: "Vi har modtaget din besked og vender tilbage."
		};
		document.getElementById("svar-titel").textContent = valgt.titel;
		document.getElementById("svar-tekst").textContent = valgt.tekst;

		// Se kommentaren ved #header-spacer i markup'et: .section's padding-top:100px
		// !important ligger delvist skjult bag den faste header, så vi sætter en
		// spacer i fuld headerhøjde foran sektionen i stedet for at forsøge at
		// overskrive selve paddingen (umuligt uden også !important, og det ville
		// stadig ikke virke — headeren er position:fixed og optager ikke normal flow-plads).
		function rettSpacingUnderHeader() {
			var header = document.querySelector(".header--fixed");
			var spacer = document.getElementById("header-spacer");
			if (!header || !spacer) return;
			spacer.style.height = header.getBoundingClientRect().height + "px";
		}
		rettSpacingUnderHeader();
		window.addEventListener("resize", rettSpacingUnderHeader);
	})();
	</script>

	<script src="/assets/js/script.js"></script>
