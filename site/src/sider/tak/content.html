

<!-- Header-spacer: .main-wrap .section har padding-top:100px !important sitewide (kun
     section--type-hero er flush under den faste header)  -  men headeren selv er position:fixed
     med en negativ bund-margin, så en del af de 100px topluft reelt ligger SKJULT bag headeren.
     En almindelig sektion lige efter headeren får derfor kun ca. 100-81=19px synlig luft, mens
     bunden (theme-primary's padding-bottom:100px !important) er fuldt synlig. Højden sættes af
     scriptet nedenfor til headerens faktiske højde, så synlig top- og bundluft bliver ens. -->
<div id="header-spacer" style="height:81px"></div>

     som "Mindre bøvl og mere overskud"-sektionen på /p/erhverv  -  samme identitet, ikke en
     løsrevet kvitteringsboks. Teksten sættes af scriptet nedenfor ud fra ?c=accept|maybe|decline. -->

						<div class="swiper-wrapper">
							<div class="swiper-slide">
								<div class="section-slider__image">
									<img src="/assets/img/thumb/d45f7cdec7304b6b8d84e8162913f8f3371aff6e_w1500_q78.webp" alt="Heldig karltoffel, der slår benene op med en drink" loading="lazy"
