	<button type="button" id="csconsentlink" class="cookie-badge"><i class="fa-default fa-cookie"></i></button>
	</div>
	<script src="/assets/js/swiper.js"></script>
	<script src="/assets/js/site.js?v=2"></script>
	<script>
	(function(){
		var params=new URLSearchParams(location.search),preview=params.get('preview')==='1';
		var contentName='vinduesvask-gratis-indvendig-hero';
		var tracking={contentName:contentName,pixelReady:typeof window.fbq==='function',pixelLeadEvents:0,capiPayloads:0,lastEventId:null};
		window.__ktWindowOfferTracking=tracking;
		window.addEventListener('error',function(e){try{console.error('[window-offer-tracking]',e.message||'script error');}catch(_e){}});
		document.querySelectorAll('[data-preview-note]').forEach(function(el){el.hidden=!preview;});
		document.querySelectorAll('.vindue-lead-form').forEach(function(form){
			form.addEventListener('submit',async function(e){
				e.preventDefault();
				var button=form.querySelector('button[type="submit"]'),status=form.parentElement.querySelector('.vindue-form-status');
				if(button.disabled)return;
				var d=new FormData(form),address=String(d.get('address')||'').trim()+', '+String(d.get('postcode')||'').trim();
				if(preview){status.hidden=false;status.textContent='Preview-test: formularen er afprøvet. Ingen oplysninger er gemt eller sendt.';return;}
				button.disabled=true;button.textContent='Sender…';
				var id;
				try{id=(window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'vask-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);}catch(_e){id='vask-'+Date.now().toString(36);}
				tracking.lastEventId=id;
				var payload={name:String(d.get('name')||'').trim(),phone:String(d.get('phone')||'').trim(),email:'',kundetype:'privat',source:'vinduesvask-gratis-indvendig',message:'Kampagnetilbud på vinduesvask-abonnement: Indvendig vinduespudsning følger gratis med, når kunden opretter et abonnement på udvendig vinduesvask. Tilbuddet gælder ikke ved en enkeltstående vask. Vejledende værdi ca. 300–400 kr. Adresse: '+address,services:[{id:'vinduer',navn:'Udvendig vinduesvask',qty:1,enhed:'glas',freq:1,pris:17},{id:'vinduerind',navn:'Indvendig vinduespudsning (kampagnetilbud)',qty:1,enhed:'glas',freq:1,pris:0}],estimat:{md:0,aar:0,visits:1,count:2},meta_capi:{event_id:id,content_name:contentName}};
				tracking.capiPayloads+=1;
				try{
					var response=await fetch('/api/lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
					if(!response.ok)throw new Error('HTTP '+response.status);
					if(typeof window.fbq==='function'){
						window.fbq('track','Lead',{content_name:contentName,content_type:'form'},{eventID:id});
						tracking.pixelLeadEvents+=1;
					}else{console.error('[window-offer-tracking] Meta Pixel unavailable; CAPI payload was accepted but browser Lead was not sent');}
					try{(window.dataLayer=window.dataLayer||[]).push({event:'generate_lead',lead_source:contentName,lead_kundetype:'privat',content_name:contentName});}catch(_e){}
					form.hidden=true;status.hidden=false;status.textContent='Tak. Vi vender tilbage med abonnementets pris og vilkår.';
				}catch(_err){status.hidden=false;status.dataset.error='true';status.textContent='Vi kunne ikke sende forespørgslen lige nu. Prøv igen eller ring 22 22 38 33.';button.disabled=false;button.textContent='Få et abonnementstilbud';}
			});
		});
	})();
	</script>


	</body>
</html>
