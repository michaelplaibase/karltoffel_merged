<style>
  .campaign{--brown:#4c3718;--cream:#fffff0;--lime:#fff87b;--green:#616711;color:var(--brown);font-family:inherit}
  .campaign *{box-sizing:border-box}
  .campaign-hero{min-height:610px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);background:var(--brown);color:var(--cream)}
  .campaign-copy{align-self:center;max-width:730px;padding:clamp(34px,7vw,92px) clamp(24px,7vw,100px);margin-inline:auto}
  .campaign-kicker{margin:0 0 18px;color:#746523;font-size:12px;font-weight:800;letter-spacing:.14em}
  .campaign-hero .campaign-kicker{color:var(--lime)}
  .campaign-price{margin:0 0 14px;font-size:18px;color:var(--lime);font-weight:700}
  .campaign h1{margin:0;color:var(--cream);font-family:snaga-unicase-display,sans-serif;font-size:clamp(36px,5.1vw,64px);line-height:1.03;letter-spacing:.005em;text-transform:none}
  .campaign h1 span{color:var(--lime)}
  .campaign-offer{max-width:550px;margin:22px 0 0;font-size:clamp(18px,2vw,23px);line-height:1.45}
  .campaign-note{display:inline-block;margin:16px 0 0;padding:8px 14px;border-radius:999px;background:var(--lime);color:var(--brown);font-size:14px;font-weight:800}
  .campaign-button{display:inline-flex;align-items:center;gap:12px;min-height:52px;margin-top:24px;padding:13px 21px;border-radius:10px;background:var(--lime);color:var(--brown);font-weight:800;text-decoration:none}
  .campaign-button:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .campaign-footnote{max-width:440px;margin:12px 0 0;color:rgba(255,255,240,.78);font-size:13px;line-height:1.5}
  .campaign-image{position:relative;min-height:420px;background:linear-gradient(0deg,rgba(35,25,11,.18),rgba(35,25,11,.05)),url('/assets/img/thumb/7003eec2b574d33c9aba448120234c65665a4922_w1500_q78.webp') center/cover no-repeat}
  .campaign-sticker{position:absolute;right:clamp(18px,5vw,60px);bottom:30px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 22px;border:2px solid var(--brown);border-radius:16px;background:var(--lime);color:var(--brown);box-shadow:0 10px 30px #0003;font-size:14px;font-weight:800;text-align:center;transform:rotate(3deg)}
  .campaign-sticker b{font-size:22px;line-height:1}.campaign-sticker strong{margin-top:5px;font-size:19px;line-height:1.05}
  .campaign-how{padding:70px 24px 76px;background:var(--cream);text-align:center}
  .campaign-how h2{margin:0 0 38px;font-family:snaga-unicase-display,sans-serif;font-size:clamp(30px,4vw,46px);line-height:1.1}
  .campaign-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1040px;margin:0 auto 28px;text-align:left}
  .campaign-steps article{padding:24px;border:1px solid #d8d1c1;border-radius:14px;background:#fff}
  .campaign-steps article>span{display:inline-grid;width:34px;height:34px;place-items:center;border-radius:50%;background:var(--lime);font-size:12px;font-weight:900}
  .campaign-steps h3{margin:15px 0 8px;font-size:20px}.campaign-steps p{margin:0;color:#534b3b;line-height:1.55}
  .campaign-button--dark{background:var(--brown);color:var(--lime)}
  .campaign-disclaimer{max-width:680px;margin:22px auto 0;color:#665d4a;font-size:12px;line-height:1.5}
  @media(max-width:760px){.campaign-hero{grid-template-columns:1fr;min-height:0}.campaign-copy{padding:46px 24px 38px}.campaign-image{min-height:280px}.campaign-steps{grid-template-columns:1fr;max-width:500px}.campaign-how{padding:52px 20px 58px}.campaign-how h2{margin-bottom:26px}}
  @media(prefers-reduced-motion:reduce){.campaign-button{transition:none}}
