<style>
  .campaign{--brown:#4c3718;--cream:#fffff0;--lime:#fff87b;--green:#616711;color:var(--brown);font-family:inherit}
  .campaign *{box-sizing:border-box}
  .campaign-hero{min-height:610px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);background:var(--brown);color:var(--cream)}
  .campaign-copy{align-self:center;max-width:730px;padding:clamp(34px,7vw,92px) clamp(24px,7vw,100px);margin-inline:auto}
  .campaign-kicker{margin:0 0 18px;color:#746523;font-size:12px;font-weight:800;letter-spacing:.14em}
  .campaign-hero .campaign-kicker{color:var(--lime)}
  .campaign-price{margin:0 0 14px;font-size:18px;color:var(--lime);font-weight:700}
  .campaign h1{margin:0;color:var(--cream);font-family:snaga-unicase-display,sans-serif;font-size:clamp(36px,5.1vw,64px);line-height:1.03;letter-spacing:.005em;text-transform:none}
  .campaign h1 span{color:var(--lime)}
  .campaign-offer{max-width:550px;margin:22px 0 0;font-size:clamp(18px,2vw,23px);line-height:1.45}
  .campaign-note{display:inline-block;margin:16px 0 0;padding:8px 14px;border-radius:999px;background:var(--lime);color:var(--brown);font-size:14px;font-weight:800}
  .campaign-button{display:inline-flex;align-items:center;gap:12px;min-height:52px;margin-top:24px;padding:13px 21px;border-radius:10px;background:var(--lime);color:var(--brown);font-weight:800;text-decoration:none}
  .campaign-button:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .campaign-footnote{max-width:440px;margin:12px 0 0;color:rgba(255,255,240,.78);font-size:13px;line-height:1.5}
  .campaign-image{position:relative;min-height:420px;background:linear-gradient(0deg,rgba(35,25,11,.18),rgba(35,25,11,.05)),url('/assets/img/thumb/7003eec2b574d33c9aba448120234c65665a4922_w1500_q78.webp') center/cover no-repeat}
  .campaign-sticker{position:absolute;right:clamp(18px,5vw,60px);bottom:30px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 22px;border:2px solid var(--brown);border-radius:16px;background:var(--lime);color:var(--brown);box-shadow:0 10px 30px #0003;font-size:14px;font-weight:800;text-align:center;transform:rotate(3deg)}
  .campaign-sticker b{font-size:22px;line-height:1}.campaign-sticker strong{margin-top:5px;font-size:19px;line-height:1.05}
  .campaign-form-section{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);gap:26px 48px;max-width:1100px;margin:auto;padding:64px 28px 76px;background:var(--cream)}
  .campaign-form-intro h2,.campaign-thanks h2{margin:0 0 12px;font-family:snaga-unicase-display,sans-serif;font-size:clamp(30px,4vw,42px);line-height:1.08}
  .campaign-form-intro>p:not(.campaign-kicker){max-width:340px;font-size:18px;line-height:1.45}
  .campaign-phone{display:inline-block;margin-top:14px;color:var(--brown);font-weight:800;text-underline-offset:3px}
  .campaign-form{padding:24px;border:1px solid #ded8c8;border-radius:16px;background:#fff}
  .campaign-form label{display:block;font-size:13px;font-weight:750;color:var(--brown)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .campaign-form input,.campaign-form select,.campaign-form textarea{display:block;width:100%;min-height:48px;margin-top:6px;padding:11px 12px;border:1px solid #bcb4a2;border-radius:8px;background:#fff;color:var(--brown);font:inherit;font-size:16px}
  .campaign-form textarea{resize:vertical}
  .campaign-form input:focus,.campaign-form select:focus,.campaign-form textarea:focus{outline:3px solid #d3ce68;outline-offset:1px;border-color:var(--brown)}
  .hedge-questions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 0;padding:0;border:0}
  .hedge-questions legend{grid-column:1/-1;margin-bottom:2px;font-weight:850;font-size:17px}
  .hedge-questions .wide{grid-column:1/-1}
  .optional{font-weight:400;color:#6a6253}
  .campaign-submit{border:0;cursor:pointer;font:inherit;font-weight:800}
  .campaign-submit:disabled{opacity:.65;cursor:wait}
  .form-privacy{margin:10px 0 0;color:#655d4e;font-size:12px;line-height:1.4}
  .campaign-form-error{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:#fbe9e5;color:#822b1c;font-weight:700}
  .campaign-thanks{grid-column:1/-1;padding:32px;border-radius:16px;background:#fff}
  .campaign-thanks[hidden],.campaign-form-error[hidden]{display:none}
  @media(max-width:760px){.campaign-hero{grid-template-columns:1fr;min-height:0}.campaign-copy{padding:38px 22px 32px}.campaign-image{min-height:250px}.campaign h1{font-size:clamp(34px,9vw,48px)}.campaign-form-section{grid-template-columns:1fr;gap:22px;padding:42px 18px 52px}.campaign-form-intro h2{font-size:34px}.campaign-form{padding:18px}.form-grid,.hedge-questions{grid-template-columns:1fr;gap:12px}.hedge-questions .wide{grid-column:auto}.campaign-sticker{right:20px;bottom:18px}.campaign-button{width:100%;justify-content:center;text-align:center}}
  @media(prefers-reduced-motion:reduce){.campaign-button{transition:none}}
</style>
